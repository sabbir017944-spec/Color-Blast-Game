<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17113b"><meta name="description" content="Color Blast — a bright match-3 puzzle game."><title>Color Blast — Match 3 Puzzle</title><link rel="stylesheet" href="style.css?v=4"></head>
<body><main class="app-shell">
<header class="topbar"><a class="brand" href="#"><span class="brand-mark">✦</span><span>COLOR <b>BLAST</b></span></a><button class="icon-button" id="soundBtn" aria-label="Toggle sound">♫</button></header>
<section class="game-card"><div class="game-heading"><div><p class="eyebrow">PUZZLE ADVENTURE</p><h1>Color Blast!</h1><p class="subtitle">Match gems. Make magic. Beat your best.</p></div><div class="level-pill"><span>LEVEL</span><strong id="level">1</strong></div></div>
<div class="stats"><div class="stat"><span class="stat-icon">🎯</span><div><small>TARGET</small><strong id="target">600</strong></div></div><div class="stat score-stat"><span class="stat-icon">⭐</span><div><small>SCORE</small><strong id="score">0</strong></div></div><div class="stat"><span class="stat-icon">👣</span><div><small>MOVES</small><strong id="moves">25</strong></div></div></div>
<div class="progress-track"><div id="progressBar" class="progress-fill"></div></div><div class="board-wrap"><div id="board" class="board" role="grid" aria-label="Puzzle board"></div></div><p class="hint" id="hint" aria-live="polite">Swap two gems to match 3 or more!</p>
<div class="action-row"><button class="secondary-button" id="shuffleBtn">⤨ <span>Shuffle</span></button><button class="secondary-button" id="restartBtn">↻ <span>Restart</span></button><button class="secondary-button" id="pauseBtn">Ⅱ <span>Pause</span></button></div></section><footer>Made for curious minds <span>✦</span> Play anywhere, anytime</footer></main>
<div class="modal-backdrop hidden" id="modal"><section class="modal" role="dialog" aria-modal="true"><div class="modal-sparkle" id="modalIcon">🌟</div><p class="eyebrow" id="modalEyebrow">NICE WORK!</p><h2 id="modalTitle">Level complete!</h2><p id="modalText">You reached the target score.</p><button class="primary-button" id="modalAction">Next level →</button></section></div><script src="game.js?v=4"></script></body></html>
